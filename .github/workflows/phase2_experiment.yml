name: Phase 2 Pipeline

# Runs the full chain on a GitHub runner:
#   Phase 1 label evaluation -> dataset rebuild -> fix_ts -> GATE
#   -> Phase 2 grid -> latency imputation sensitivity -> reports
#
# The gate (check_label_consistency) sits BEFORE the expensive steps, so a
# label-vintage mismatch costs two minutes instead of two hours. The runner
# needs neither the 101 MB JIT-Fine zip nor the 830 MB of cloned repos: both
# are replaced by the committed phase2_features.csv and fix_commit_dates.csv.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'smoke (3 seeds, ~10 min) or full (10 seeds, ~2 h)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'full'
      latency_mode:
        description: 'Verification Latency Mode'
        required: true
        default: 'real'
        type: choice
        options:
          - 'real'
          - 'uniform'
      push_results:
        description: 'Commit results back to master (full stage only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: phase2-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip list

      # --- Rebuild the data chain from committed inputs -------------------

      - name: Phase 1 - evaluate SZZ labels against the oracle
        run: python -m experiments.evaluate_confusion_matrix

      - name: Rebuild Phase 2 dataset from current Phase 1 labels
        run: |
          python -c "from codebase.data.loader import build_unified_dataset; build_unified_dataset()"

      - name: Reconstruct verification latency (fix_ts)
        run: python scripts/build_fix_ts.py --mode ${{ inputs.latency_mode }}

      # --- Gate: refuse to spend compute on inconsistent labels -----------

      - name: GATE - Phase 1 / Phase 2 label consistency
        run: python -m experiments.check_label_consistency

      # --- Experiments ----------------------------------------------------

      - name: Run Phase 2 experiment grid
        run: |
          FAST_FLAG=""
          if [ "${{ inputs.stage }}" = "smoke" ]; then FAST_FLAG="--fast"; fi
          python -m experiments.run_phase2_impact \
            --latency_mode ${{ inputs.latency_mode }} $FAST_FLAG

      - name: Run latency imputation sensitivity
        run: python -m experiments.run_latency_imputation_sensitivity

      - name: Generate reports and figures
        run: python scripts/generate_report.py

      # --- Publish --------------------------------------------------------

      - name: Commit and push results
        if: ${{ inputs.stage == 'full' && inputs.push_results }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # generate_report.py writes figures to BOTH reports/figures and
          # manuscript/figures. Omitting manuscript/ left tracked PNGs modified
          # but unstaged, and `git pull --rebase` refuses to run with a dirty
          # tree -- which failed the push after a successful 2h run.
          git add data/processed/phase2_commits.csv \
                  data/processed/phase2_commits.provenance.json \
                  phase1_bias.json results/ reports/ manuscript/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Phase 2 results (stage: ${{ inputs.stage }}, latency: ${{ inputs.latency_mode }})

          Rebuilt from current Phase 1 labels; label-consistency gate passed."
          git pull --rebase --autostash origin master
          git push origin master

      - name: Upload results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-${{ inputs.stage }}-${{ inputs.latency_mode }}
          path: |
            results/phase1/*.csv
            results/phase2/*.csv
            reports/
            phase1_bias.json
            data/processed/phase2_commits.provenance.json
          if-no-files-found: warn
